<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080a22">
<title>酒場バトル！どんちゃん横丁</title>
<!-- フォントはオンライン時のみ読み込み（オフラインでも端末のフォントで動作します） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#080a22; --bg1:#121842; --bg2:#1b2259;
  --panel:rgba(22,28,74,.88); --panel2:rgba(32,40,100,.9);
  --ink:#fff6e6; --dim:#aab2db; --line:rgba(255,255,255,.12);
  --red:#ff4d5e; --red2:#c8243a; --orange:#ff9a3c; --yellow:#ffd23f;
  --teal:#2ee6c5; --teal2:#13a58b; --purple:#a46bff; --purple2:#6f3fd1;
  --pink:#ff6fb5; --blue:#4fb3ff; --green:#5be37a;
  --radius:20px;
  --font-head:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --font-body:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--font-body);font-weight:500;overscroll-behavior:none}
body{min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
   radial-gradient(1200px 600px at 50% -10%,rgba(164,107,255,.28),transparent 60%),
   radial-gradient(800px 500px at 0% 100%,rgba(255,77,94,.18),transparent 60%),
   radial-gradient(800px 500px at 100% 90%,rgba(46,230,197,.14),transparent 60%),
   linear-gradient(180deg,var(--bg1),var(--bg0) 70%)}
#bg::before{content:"";position:absolute;inset:0;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:36px 36px;mask-image:linear-gradient(180deg,transparent,#000 60%)}
#bg .side-lantern{position:absolute;top:-10px;width:70px;opacity:.9;animation:sway 4.5s ease-in-out infinite;transform-origin:50% 0}
#bg .side-lantern.l{left:max(8px,calc(50% - 600px))}
#bg .side-lantern.r{right:max(8px,calc(50% - 600px));animation-delay:-2s}
@media (max-width:760px){#bg .side-lantern{display:none}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto;padding:14px 16px calc(20px + var(--safe-b));animation:screenIn .32s cubic-bezier(.2,.8,.2,1)}
.screen.wide{max-width:1040px}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.screen.out{animation:screenOut .16s ease forwards}
@keyframes screenOut{to{opacity:0;transform:translateY(-8px)}}
.grow{flex:1}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.dim{color:var(--dim)}
.small{font-size:13px}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;min-height:52px;margin-bottom:10px}
.topbar .title{flex:1;min-width:0;font-family:var(--font-head);font-size:19px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title small{display:block;font-family:var(--font-body);font-size:12px;color:var(--dim);letter-spacing:0;font-weight:700}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.chip.x2{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#3a1800;border:0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.panel.neon{border:2px solid rgba(255,210,63,.55);box-shadow:0 0 0 1px rgba(255,210,63,.15),0 0 26px rgba(255,154,60,.25),0 10px 30px rgba(0,0,0,.4)}
.panel h2,.h2{font-family:var(--font-head);font-size:22px;margin:0 0 8px;letter-spacing:.03em}
.panel h3,.h3{font-size:16px;margin:0 0 6px;font-weight:900}
.lead{font-size:16px;line-height:1.7;color:var(--ink)}
.rule-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rule-list li{display:flex;gap:10px;line-height:1.6;font-size:15px}
.rule-list li b.n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--red);font-size:13px;margin-top:1px}
.note{font-size:13px;color:var(--dim);line-height:1.6}

/* ---------- buttons ---------- */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:12px 18px;border-radius:18px;
  font-family:var(--font-head);font-size:20px;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,#ff6a78,var(--red));box-shadow:0 6px 0 var(--red2),0 10px 22px rgba(255,77,94,.35);
  transition:transform .08s,box-shadow .08s,filter .2s;user-select:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--red2),0 4px 10px rgba(255,77,94,.3)}
.btn small{font-family:var(--font-body);font-weight:700;font-size:12px;opacity:.85}
.btn.yellow{background:linear-gradient(180deg,#ffe27a,var(--yellow));color:#3b2300;box-shadow:0 6px 0 #c99a10,0 10px 22px rgba(255,210,63,.3)}
.btn.yellow:active{box-shadow:0 1px 0 #c99a10}
.btn.teal{background:linear-gradient(180deg,#6af3da,var(--teal));color:#003b31;box-shadow:0 6px 0 var(--teal2),0 10px 22px rgba(46,230,197,.28)}
.btn.teal:active{box-shadow:0 1px 0 var(--teal2)}
.btn.purple{background:linear-gradient(180deg,#c09bff,var(--purple));box-shadow:0 6px 0 var(--purple2),0 10px 22px rgba(164,107,255,.3)}
.btn.purple:active{box-shadow:0 1px 0 var(--purple2)}
.btn.ghost{background:rgba(255,255,255,.06);border:2px solid var(--line);box-shadow:none;font-size:17px;min-height:54px}
.btn.ghost:active{transform:scale(.98)}
.btn.sm{min-height:46px;font-size:16px;border-radius:14px}
.btn[disabled],.btn.disabled{filter:grayscale(.8) brightness(.7);pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}
.footer-actions{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:12px}

/* toggles & chips */
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:10px;font-weight:900;font-size:15px;color:var(--dim)}
.seg button.on{background:var(--yellow);color:#3b2300}
.pill-set{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:42px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:14px;color:var(--dim);background:rgba(255,255,255,.04)}
.pill.on{border-color:var(--teal);color:var(--ink);background:rgba(46,230,197,.15)}
.toggle{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:800;font-size:14px}
.toggle .dot{width:34px;height:20px;border-radius:999px;background:#444b75;position:relative;transition:.2s}
.toggle .dot::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .dot{background:var(--teal)}
.toggle.on .dot::after{left:16px}
.field-label{font-weight:900;font-size:14px;color:var(--dim);margin:14px 0 8px}

/* ---------- home ---------- */
.home{justify-content:flex-start;max-width:600px}
.home-hero{position:relative;text-align:center;padding:18px 0 6px}
.lantern-row{display:flex;justify-content:center;gap:16px;height:96px}
.lantern-row svg{width:56px;animation:sway 4s ease-in-out infinite;transform-origin:50% 0;filter:drop-shadow(0 0 16px rgba(255,77,94,.65))}
.lantern-row svg:nth-child(2){animation-delay:-1.3s;width:64px}
.lantern-row svg:nth-child(3){animation-delay:-2.6s}
.sign{position:relative;margin:4px auto 0;padding:18px 14px 16px;border-radius:22px;border:3px solid rgba(255,111,181,.85);
  box-shadow:0 0 18px rgba(255,111,181,.6),inset 0 0 18px rgba(255,111,181,.35);background:rgba(10,8,30,.55)}
.sign .kicker{font-family:var(--font-head);font-size:clamp(18px,5vw,24px);color:var(--teal);text-shadow:0 0 8px var(--teal),0 0 22px rgba(46,230,197,.6);letter-spacing:.2em}
.sign h1{margin:6px 0 0;font-family:var(--font-head);font-weight:400;font-size:clamp(36px,11vw,64px);line-height:1.08;letter-spacing:.04em;color:#fff3c4;
  text-shadow:0 0 6px #ffcf4a,0 0 16px #ff9a3c,0 0 34px #ff4d5e,0 3px 0 #9a2232;animation:flicker 6s infinite}
.sign .tag{margin-top:10px;font-weight:800;font-size:14px;color:var(--dim)}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
.noren{display:flex;justify-content:center;gap:5px;margin:14px auto 0;width:min(320px,90%)}
.noren span{flex:1;height:38px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#3b4bb8,#24307d);display:grid;place-items:center;font-family:var(--font-head);font-size:18px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);animation:noren 3.4s ease-in-out infinite;transform-origin:50% 0}
.noren span:nth-child(2n){animation-delay:-1s}
.noren span:nth-child(3n){animation-delay:-2s}
@keyframes noren{0%,100%{transform:skewX(0)}50%{transform:skewX(3deg)}}
.home-menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.home-menu .btn.big{grid-column:1/-1;min-height:78px;font-size:25px}
.home-menu .btn:not(.big){min-height:64px;font-size:18px}
.sound-row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.resume{margin-top:14px}
.ticker{margin-top:18px;overflow:hidden;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:8px 0;white-space:nowrap;font-weight:800;color:var(--yellow);font-size:14px}
.ticker div{display:inline-block;padding-left:100%;animation:tick 26s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- avatars ---------- */
.ava{--c:#ff5a5f;position:relative;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),var(--c);
  font-family:var(--font-head);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 0 0 3px rgba(255,255,255,.12),0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}
.ava::before,.ava::after{content:"";position:absolute;left:50%;width:44%;height:9%;transform:translateX(-50%);background:#2a1b10;border-radius:3px}
.ava::before{top:-3%}.ava::after{bottom:-3%}
.ava.xl{width:110px;height:110px;font-size:48px}
.ava.lg{width:76px;height:76px;font-size:32px}
.ava.sm{width:36px;height:36px;font-size:16px}
.ava.xs{width:28px;height:28px;font-size:13px;box-shadow:none}

/* ---------- player setup ---------- */
.player-list{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);animation:screenIn .25s}
.prow .ava{cursor:pointer}
.prow input{flex:1;min-width:0;height:50px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);padding:0 12px;font-size:18px;font-weight:800}
.prow input:focus{outline:0;border-color:var(--yellow)}
.prow .del{width:44px;height:44px;border-radius:12px;background:rgba(255,77,94,.15);color:var(--red);font-size:22px;font-weight:900}
.prow .del[disabled]{opacity:.25;pointer-events:none}
.ava-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;justify-items:center}
.ava-picker button{padding:6px;border-radius:50%;border:3px solid transparent}
.ava-picker button.on{border-color:var(--yellow)}
.ava-picker button[disabled]{opacity:.3}
.ava-picker .label{font-size:12px;color:var(--dim);margin-top:2px;text-align:center}
.count-ctrl{display:flex;align-items:center;justify-content:center;gap:18px}
.count-ctrl button{width:54px;height:54px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-size:28px;font-weight:900}
.count-ctrl button[disabled]{opacity:.3;pointer-events:none}
.count-ctrl .num{font-family:var(--font-head);font-size:40px;min-width:90px;text-align:center}

/* ---------- mode select ---------- */
.mode-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.mode-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.mode-grid{grid-template-columns:1fr 1fr 1fr}}
.mode-card{position:relative;text-align:left;display:flex;gap:14px;padding:16px;border-radius:22px;background:var(--panel);border:2px solid var(--line);overflow:hidden;transition:transform .12s,border-color .2s;min-height:120px}
.mode-card:active{transform:scale(.98)}
.mode-card:hover{border-color:var(--mc)}
.mode-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--mc);opacity:.13}
.mode-card .icon{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--mc);box-shadow:0 0 18px color-mix(in srgb,var(--mc) 55%,transparent)}
.mode-card .icon svg{width:38px;height:38px}
.mode-card h3{margin:2px 0 4px;font-family:var(--font-head);font-weight:400;font-size:20px}
.mode-card p{margin:0;font-size:14px;line-height:1.55;color:var(--dim)}
.mode-card .meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mode-card .meta span{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
.mode-card .star{position:absolute;top:10px;right:12px;font-size:11px;font-weight:900;color:#3b2300;background:var(--yellow);padding:3px 8px;border-radius:999px;z-index:1}
.mini-rank{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mini-rank::-webkit-scrollbar{display:none}
.mini-rank .mr{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--panel2);font-weight:800;font-size:14px}

/* ---------- pass screen ---------- */
.pass{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:10px 0}
.pass .hand{width:120px;height:120px;opacity:.95}
.pass .who{font-family:var(--font-head);font-size:clamp(30px,9vw,42px);line-height:1.2}
.pass .msg{font-size:17px;line-height:1.7;color:var(--dim);max-width:340px}
.pass .shield{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,210,63,.12);color:var(--yellow);font-weight:800;font-size:14px}
.pass .btn{max-width:360px}
.progress-dots{display:flex;gap:6px;justify-content:center}
.progress-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.progress-dots i.done{background:var(--teal)}
.progress-dots i.now{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}

/* ---------- 二択 ---------- */
.topic-card{position:relative;padding:18px 16px;border-radius:24px;background:linear-gradient(160deg,rgba(255,77,94,.18),rgba(164,107,255,.18));border:2px solid rgba(255,255,255,.14);text-align:center}
.topic-card .genre{display:inline-block;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.3);color:var(--yellow)}
.topic-card .q{font-family:var(--font-head);font-size:20px;margin-top:8px}
.vs-wrap{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.choice{position:relative;width:100%;min-height:118px;padding:18px 18px 18px 72px;border-radius:24px;text-align:left;font-size:clamp(19px,5.4vw,24px);font-weight:900;line-height:1.45;color:#fff;
  transition:transform .1s, box-shadow .2s}
.choice:active{transform:scale(.97)}
.choice .tag{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-head);font-size:26px;background:rgba(0,0,0,.25)}
.choice.a{background:linear-gradient(135deg,#ff5f6e,#e2335e);box-shadow:0 7px 0 #9e1e3d,0 0 26px rgba(255,77,94,.35)}
.choice.b{background:linear-gradient(135deg,#3fb7ff,#4a5cff);box-shadow:0 7px 0 #2a3399,0 0 26px rgba(79,179,255,.35)}
.vs{align-self:center;font-family:var(--font-head);font-size:26px;color:var(--yellow);text-shadow:0 0 12px var(--orange);margin:-4px 0}
.result-bars{display:flex;flex-direction:column;gap:14px}
.rbar{position:relative;border-radius:22px;padding:14px 16px;overflow:hidden;background:rgba(255,255,255,.05);border:2px solid var(--line)}
.rbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);opacity:.85}
.rbar.a .fill{background:linear-gradient(90deg,#e2335e,#ff5f6e)}
.rbar.b .fill{background:linear-gradient(90deg,#4a5cff,#3fb7ff)}
.rbar>*:not(.fill){position:relative}
.rbar .lab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rbar .lab b{font-size:17px;line-height:1.4}
.rbar .cnt{font-family:var(--font-head);font-size:30px;white-space:nowrap}
.rbar .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:28px}
.rbar .who span{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(0,0,0,.3);font-weight:800;font-size:14px;animation:pop .4s backwards}
.badge{display:inline-block;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--yellow);color:#3b2300;margin-left:6px;vertical-align:middle}
.badge.minor{background:var(--teal);color:#003b31}
.special{text-align:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,rgba(255,210,63,.2),rgba(255,111,181,.2));border:2px dashed var(--yellow);animation:pop .5s}
.special b{display:block;font-family:var(--font-head);font-size:24px;color:var(--yellow)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}

/* drumroll */
.drum{flex:1;display:grid;place-items:center;text-align:center}
.drum .big{font-family:var(--font-head);font-size:clamp(34px,10vw,52px);animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(1px,0) rotate(-1deg)}50%{transform:translate(-1px,1px) rotate(1deg)}100%{transform:translate(0,-1px)}}

/* ---------- お絵描き ---------- */
.draw-wrap{display:flex;flex-direction:column;gap:10px;flex:1}
.canvas-box{position:relative;width:100%;aspect-ratio:1/1;max-height:min(62dvh,560px);margin:0 auto;border-radius:18px;overflow:hidden;background:#fffdf6;box-shadow:0 0 0 4px #e7c98a,0 0 0 8px #6b4524,0 12px 30px rgba(0,0,0,.4)}
.canvas-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.timer-bar{height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.timer-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));transform-origin:left;transition:transform .25s linear}
.timer-bar.warn i{background:linear-gradient(90deg,var(--orange),var(--red))}

.text-input{width:100%;height:60px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);padding:0 16px;font-size:22px;font-weight:900}

.role-card{perspective:1000px;width:100%;max-width:360px;margin:0 auto}

.spot{position:relative;display:inline-block;padding:20px}

.vt.is-traitor{background:rgba(255,77,94,.15);border:1px solid var(--red)}

.answers.two{grid-template-columns:1fr 1fr}
.ans{min-height:64px;border-radius:18px;padding:10px 14px;font-size:19px;font-weight:900;background:var(--panel2);border:2px solid var(--line);text-align:left;display:flex;align-items:center;gap:12px;transition:transform .1s}

.ans.correct{border-color:var(--green);background:rgba(91,227,122,.2)}
.ans.wrong{border-color:var(--red);background:rgba(255,77,94,.2)}
.ans.fade{opacity:.4}
.verdict{text-align:center;font-family:var(--font-head);font-size:38px;animation:pop .45s}
.verdict.ok{color:var(--green);text-shadow:0 0 18px rgba(91,227,122,.6)}
.verdict.ng{color:var(--red)}

.groups{display:flex;flex-direction:column;gap:10px}
.group{padding:12px 14px;border-radius:18px;background:var(--panel2);border:2px solid var(--line);animation:pop .4s backwards}

.wheel-hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ff9a3c 60%,#c25b12);display:grid;place-items:center;font-family:var(--font-head);font-size:14px;color:#3b1800;box-shadow:0 0 0 5px #3b1800,0 0 20px rgba(255,154,60,.8)}

.rank.p3{border-color:#e39a5b}

.rank .nm small{display:block;font-size:12px;color:var(--dim);font-weight:700}

.title-card .why{font-size:13px;color:var(--dim);font-weight:700}

.modal-back{position:fixed;inset:0;z-index:50;background:rgba(4,5,20,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:440px;max-height:86dvh;overflow:auto;background:var(--bg2);border:2px solid var(--line);border-radius:24px;padding:20px;animation:pop .28s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{font-family:var(--font-head);font-weight:400;font-size:22px;margin:0 0 10px}
.modal p{line-height:1.7;margin:0 0 14px}
.modal .btn-row{margin-top:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(140%);z-index:60;padding:12px 20px;border-radius:999px;background:#fff3c4;color:#3b2300;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s,opacity .3s;max-width:90vw;text-align:center;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* transition curtain */
#curtain{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center;opacity:0}
#curtain.on{animation:curtain .9s ease forwards}
#curtain .ct{font-family:var(--font-head);font-size:clamp(30px,9vw,54px);color:#fff3c4;text-shadow:0 0 14px #ff9a3c,0 0 32px #ff4d5e;transform:scale(.8)}
#curtain::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(20,14,50,.92),rgba(5,6,22,.98))}
#curtain .ct{position:relative}
@keyframes curtain{0%{opacity:0}18%{opacity:1}75%{opacity:1}100%{opacity:0}}
#curtain.on .ct{animation:ctin .9s ease forwards}
@keyframes ctin{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.05);opacity:1}75%{transform:scale(1)}100%{transform:scale(1.1);opacity:0}}

/* confetti */
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none;width:100%;height:100%}

@media (min-width:720px){
  .screen{padding-top:22px}
  .choice{min-height:130px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
}

.gicon{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--mc);box-shadow:0 0 18px color-mix(in srgb,var(--mc) 55%,transparent)}
.gicon svg{width:38px;height:38px}

/* ---------- Timers（画面ごとに自動クリアして状態漏れを防ぐ） ---------- */
const Timers = {
  ids: new Set(), rafs: new Set(),
  timeout(fn, ms) { const id = setTimeout(() => { this.ids.delete(id); fn(); }, ms); this.ids.add(id); return id; },
  interval(fn, ms) { const id = setInterval(fn, ms); this.ids.add(id); return id; },
  raf(fn) { const id = requestAnimationFrame(t => { this.rafs.delete(id); fn(t); }); this.rafs.add(id); return id; },
  clear(id) { clearTimeout(id); clearInterval(id); this.ids.delete(id); },
  clearAll() { this.ids.forEach(id => { clearTimeout(id); clearInterval(id); }); this.ids.clear(); this.rafs.forEach(cancelAnimationFrame); this.rafs.clear(); }
};
/* 残り時間カウントダウン。onTick(残り秒, 残り割合) / onEnd() */
function countdown(sec, onTick, onEnd, { tickSound = true } = {}) {
  const total = sec * 1000; let end = performance.now() + total; let lastWhole = Math.ceil(sec); let done = false; let paused = 0;
  const step = () => {
    if (done) return;
    if (paused) return;
    const left = Math.max(0, end - performance.now());
    const whole = Math.ceil(left / 1000);
    onTick(left / 1000, left / total);
    if (whole !== lastWhole) { lastWhole = whole; if (tickSound && whole <= 5 && whole > 0) Sound.play(whole <= 3 ? 'tock' : 'tick'); }
    if (left <= 0) { done = true; Timers.clear(id); onEnd(); }
  };
  const id = Timers.interval(step, 100); step();
  return {
    stop() { done = true; Timers.clear(id); },
    finish() { if (done) return; done = true; Timers.clear(id); onEnd(); },
    pause() { if (!paused) paused = performance.now(); },
    resume() { if (paused) { end += performance.now() - paused; paused = 0; } },
    get done() { return done; }
  };
}

/* ---------- Sound（Web Audio APIで合成。音声ファイル不要） ---------- */
const Sound = {
  ctx: null, out: null, sfxBus: null, bgmBus: null,
  sfxOn: true, bgmOn: false, bgmTimer: null,
  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        this.ctx = new AC();
        this.out = this.ctx.createGain(); this.out.gain.value = .9; this.out.connect(this.ctx.destination);
        this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = .8; this.sfxBus.connect(this.out);
        this.bgmBus = this.ctx.createGain(); this.bgmBus.gain.value = .22; this.bgmBus.connect(this.out);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  tone(f, dur, o = {}) {
    const c = this.ctx; const t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const v = o.vol ?? .2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.attack || .006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.bus || this.sfxBus); osc.start(t); osc.stop(t + dur + .02);
  },
  noise(dur, o = {}) {
    const c = this.ctx; const t = c.currentTime + (o.at || 0);
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = o.ftype || 'bandpass'; f.frequency.setValueAtTime(o.freq || 2000, t);
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(o.vol ?? .2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.bus || this.sfxBus); src.start(t); src.stop(t + dur + .02);
  },
  play(name) {
    if (!this.sfxOn || !this.ensure()) return;
    try {
      const T = (f, d, o) => this.tone(f, d, o), N = (d, o) => this.noise(d, o);
      switch (name) {
        case 'click': T(720, .06, { type: 'square', vol: .05 }); break;
        case 'tap': T(520, .09, { type: 'triangle', vol: .16, slide: 820 }); break;
        case 'confirm': T(660, .09, { type: 'triangle', vol: .18 }); T(990, .16, { type: 'triangle', vol: .18, at: .08 }); break;
        case 'pass': T(440, .1, { type: 'sine', vol: .16 }); T(554, .1, { type: 'sine', vol: .16, at: .09 }); T(659, .18, { type: 'sine', vol: .16, at: .18 }); break;
        case 'correct': [523, 659, 784, 1047].forEach((f, i) => T(f, .2, { type: 'triangle', vol: .2, at: i * .07 })); break;
        case 'wrong': T(220, .35, { type: 'sawtooth', vol: .12, slide: 110 }); break;
        case 'tick': T(1250, .035, { type: 'square', vol: .045 }); break;
        case 'tock': T(880, .09, { type: 'square', vol: .08 }); break;
        case 'buzzer': T(160, .6, { type: 'square', vol: .12 }); T(165, .6, { type: 'sawtooth', vol: .06 }); break;
        case 'drum': for (let i = 0; i < 26; i++) N(.07, { at: i * .06, freq: 300 + rnd(80), vol: .1 + i * .008, ftype: 'lowpass' }); break;
        case 'reveal': N(.6, { freq: 6000, ftype: 'highpass', vol: .18 }); [392, 523, 659].forEach(f => T(f, .7, { type: 'triangle', vol: .14 })); break;
        case 'fanfare': [[523, 0], [523, .12], [523, .24], [659, .36], [784, .6], [659, .78], [784, .9], [1047, 1.1]].forEach(([f, a]) => { T(f, .22, { type: 'square', vol: .07, at: a }); T(f, .3, { type: 'triangle', vol: .14, at: a }); }); break;
        case 'spin': T(1500 + rnd(300), .025, { type: 'square', vol: .05 }); break;
        case 'pop': N(.08, { freq: 3200, vol: .2 }); T(900, .07, { type: 'sine', vol: .12, slide: 1600 }); break;
        case 'whoosh': N(.45, { freq: 400, sweep: 4000, vol: .14 }); break;
        case 'ominous': [110, 116.5].forEach(f => T(f, 1.4, { type: 'sawtooth', vol: .07 })); T(55, 1.4, { type: 'sine', vol: .25 }); break;
        case 'unanimous': [523, 659, 784, 1047, 1319].forEach((f, i) => T(f, .3, { type: 'triangle', vol: .17, at: i * .06 })); N(.5, { freq: 7000, ftype: 'highpass', vol: .1, at: .3 }); break;
        case 'erase': N(.12, { freq: 1200, vol: .08 }); break;
      }
    } catch (e) { /* 音が鳴らなくてもゲームは継続 */ }
  },
  /* --- BGM：ゆるい横丁風ペンタトニック --- */
  setBgm(on) { this.bgmOn = on; on ? this.bgmStart() : this.bgmStop(); },
  bgmStart() {
    if (!this.bgmOn || this.bgmTimer || !this.ensure()) return;
    this.step = 0; this.nextT = this.ctx.currentTime + .12;
    this.bgmTimer = setInterval(() => this._sched(), 70);
  },
  bgmStop() { clearInterval(this.bgmTimer); this.bgmTimer = null; },
  _sched() {
    const c = this.ctx; if (!c || c.state !== 'running') return;
    const stepDur = 60 / 104 / 2;
    while (this.nextT < c.currentTime + .25) { this._step(this.step, this.nextT - c.currentTime); this.nextT += stepDur; this.step = (this.step + 1) % 64; }
  },
  _step(s, at) {
    const N = { D4: 293.66, E4: 329.63, F4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.25 };
    const mel = ['A4', 0, 'B4', 'A4', 'F4', 0, 'E4', 0, 'D4', 0, 'E4', 'F4', 'A4', 0, 0, 0, 'B4', 0, 'D5', 'B4', 'A4', 0, 'F4', 0, 'E4', 0, 'F4', 'E4', 'D4', 0, 0, 0,
      'F4', 0, 'A4', 0, 'B4', 0, 'A4', 'B4', 'D5', 0, 'B4', 0, 'A4', 0, 0, 0, 'B4', 'A4', 'F4', 0, 'E4', 'F4', 'A4', 0, 'E4', 0, 0, 'D4', 0, 0, 0, 0];
    const roots = [73.42, 61.74, 49, 55, 73.42, 61.74, 49, 55];
    const b = this.bgmBus; const m = mel[s];
    if (m) { this.tone(N[m], .32, { type: 'triangle', vol: .2, at, bus: b }); this.tone(N[m] * 2, .12, { type: 'square', vol: .025, at, bus: b }); }
    const bar = Math.floor(s / 8), pos = s % 8;
    if (pos === 0 || pos === 4) this.tone(roots[bar] * (pos === 4 ? 2 : 1), .3, { type: 'triangle', vol: .32, at, bus: b });
    if (pos % 2 === 1) this.noise(.03, { at, freq: 8000, ftype: 'highpass', vol: .05, bus: b });
    if (pos === 2 || pos === 6) this.noise(.06, { at, freq: 1800, vol: .06, bus: b });
  }
};

/* ---------- Store：プレイヤーとセッション状態 ---------- */
const Store = {
  players: [],          // [{id, name, avatar}]
  session: null,        // 得点・成績・履歴
  settings: { sfx: true, bgm: false },
  newSession() {
    const s = { id: uid('ses'), scores: {}, wins: {}, stats: {}, games: {}, history: [], committed: {}, multiplier: 1, recent: [], rankTrail: {}, startedAt: Date.now() };
    this.players.forEach(p => { s.scores[p.id] = 0; s.wins[p.id] = 0; s.stats[p.id] = {}; s.games[p.id] = {}; s.rankTrail[p.id] = []; });
    this.session = s; this.save();
  },
  /* プレイヤー構成が変わってもセッションを壊さないよう補完 */
  syncSession() {
    if (!this.session) return this.newSession();
    const s = this.session;
    this.players.forEach(p => {
      if (!(p.id in s.scores)) { s.scores[p.id] = 0; s.wins[p.id] = 0; s.stats[p.id] = {}; s.games[p.id] = {}; s.rankTrail[p.id] = []; }
    });
    this.save();
  },
  player(id) { return this.players.find(p => p.id === id); },
  avatar(p) { return DATA.avatars.find(a => a.id === p.avatar) || DATA.avatars[0]; },
  save() { Persist.save({ players: this.players, session: this.session, settings: this.settings }); },
  load() {
    const d = Persist.load(); if (!d) return false;
    if (d.settings) this.settings = Object.assign(this.settings, d.settings);
    if (Array.isArray(d.players) && d.players.length >= 3 && d.players.every(p => p && p.id && typeof p.name === 'string')) {
      this.players = d.players; this.session = d.session || null; this.syncSession(); return true;
    }
    return false;
  },
  get hasProgress() { return this.session && this.session.history.length > 0; }
};

/* ---------- Score：得点台帳（roundIdで冪等。やり直しで二重加算しない） ---------- */
const Score = {
  /**
   * @param roundId  各ゲーム開始時に発行される一意ID
   * @param gameKey  'choice' など
   * @param awards   {playerId: 点数}
   * @param stats    {playerId: {statKey: 加算値}}
   * @param opt      {title, noMultiplier}
   */
  commit(roundId, gameKey, awards, stats = {}, opt = {}) {
    const s = Store.session;
    if (s.committed[roundId]) return s.committed[roundId];   // 二重加算防止
    const mult = opt.noMultiplier ? 1 : s.multiplier;
    const before = this.ranking();
    const final = {};
    Store.players.forEach(p => { final[p.id] = Math.round((awards[p.id] || 0) * mult); });
    Store.players.forEach(p => {
      s.scores[p.id] += final[p.id];
      const g = s.games[p.id][gameKey] || (s.games[p.id][gameKey] = { played: 0, points: 0 });
      g.played++; g.points += final[p.id];
      const st = stats[p.id] || {};
      for (const k in st) s.stats[p.id][k] = (s.stats[p.id][k] || 0) + st[k];
    });
    // 勝利数：そのゲームの最高得点者（0点は除く・同点は全員）
    const max = Math.max(...Object.values(final));
    const winners = max > 0 ? Store.players.filter(p => final[p.id] === max).map(p => p.id) : [];
    if (!opt.noWin) winners.forEach(id => s.wins[id]++);
    if (!opt.noMultiplier && s.multiplier !== 1) s.multiplier = 1;
    const after = this.ranking();
    after.forEach(r => s.rankTrail[r.player.id].push(r.rank));
    const rec = { roundId, gameKey, title: opt.title || gameKey, awards: final, mult, winners, at: Date.now(),
      before: Object.fromEntries(before.map(r => [r.player.id, r.rank])) };
    s.history.push(rec); s.committed[roundId] = rec;
    if (!opt.noRecent) { s.recent.push(gameKey); if (s.recent.length > 6) s.recent.shift(); }
    Store.save();
    return rec;
  },
  /* 同点は同順位（1,1,3方式） */
  ranking() {
    const s = Store.session;
    const arr = Store.players.map((p, i) => ({ player: p, score: s ? (s.scores[p.id] || 0) : 0, wins: s ? (s.wins[p.id] || 0) : 0, idx: i }))
      .sort((a, b) => b.score - a.score || a.idx - b.idx);
    arr.forEach((r, i) => { r.rank = (i > 0 && arr[i - 1].score === r.score) ? arr[i - 1].rank : i + 1; });
    arr.forEach(r => { r.tie = arr.filter(x => x.rank === r.rank).length > 1; });
    return arr;
  },
  /* 称号：実際の成績に基づいて付与（最大値かつ>0、同値なら全員） */
  titles() {
    const s = Store.session; const ps = Store.players; const out = [];
    const st = (id, k) => (s.stats[id] && s.stats[id][k]) || 0;
    const defs = [
      { k: 'quizCorrect', t: 'クイズ王', why: v => `瞬間クイズで${v}問正解` },
      { k: 'drawPts', t: 'お絵描き名人', why: v => `お絵描きバトルで合計${v}点` },
      { k: 'schemer', t: '横丁の策士', why: v => `裏切り者として${v}回ミッション成功・逃げ切り` },
      { k: 'detect', t: '横丁の名探偵', why: v => `裏切り者を${v}回見抜いた` },
      { k: 'syncMatch', t: '以心伝心マスター', why: v => `以心伝心で${v}人と回答が一致` },
      { k: 'minority', t: '孤高の個性派', why: v => `究極の二択で少数派に${v}回` }
    ];
    defs.forEach(d => {
      const max = Math.max(0, ...ps.map(p => st(p.id, d.k)));
      if (max <= 0) return;
      const holders = ps.filter(p => st(p.id, d.k) === max);
      if (holders.length === ps.length) return; // 全員同じ成績なら称号なし
      ps.filter(p => st(p.id, d.k) === max).forEach(p => out.push({ pid: p.id, title: d.t, why: d.why(max) }));
    });
    // 奇跡の逆転王：途中の最低順位から最終順位までの上昇幅
    if (s.history.length >= 2) {
      const fin = this.ranking(); let best = 0; let who = [];
      fin.forEach(r => {
        const trail = s.rankTrail[r.player.id] || []; if (trail.length < 2) return;
        const worst = Math.max(...trail.slice(0, -1)); const up = worst - r.rank;
        if (up > best) { best = up; who = [{ r, worst }]; } else if (up === best && up > 0) who.push({ r, worst });
      });
      if (best >= 2 || (best >= 1 && who.some(w => w.r.rank === 1))) who.forEach(w => out.push({ pid: w.r.player.id, title: '奇跡の逆転王', why: `${w.worst}位から${w.r.rank}位へ浮上` }));
    }
    // 横丁の主役：勝利数最多
    const mw = Math.max(0, ...ps.map(p => s.wins[p.id] || 0));
    if (mw >= 2 && ps.some(p => (s.wins[p.id] || 0) < mw)) ps.filter(p => s.wins[p.id] === mw).forEach(p => out.push({ pid: p.id, title: '横丁の主役', why: `ミニゲームで${mw}回トップ` }));
    return out;
  }
};

  },
  /* 紙吹雪（独自のrAFで動作、画面遷移後も自然に消える） */
  confetti(ms = 2600, burst = 160) {
    const cv = $('#confetti'); const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#ff4d5e', '#ffd23f', '#2ee6c5', '#a46bff', '#ff6fb5', '#4fb3ff', '#ff9a3c'];
    const parts = this._conf = (this._conf || []).concat(Array.from({ length: burst }, () => ({
      x: innerWidth * (.2 + Math.random() * .6), y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -6 - Math.random() * 10,
      r: 4 + Math.random() * 6, c: pick(cols), a: Math.random() * 6, va: (Math.random() - .5) * .4, life: ms + Math.random() * 800, shape: rnd(3)
    })));
    if (this._confRunning) return; this._confRunning = true;
    let last = performance.now();
    const loop = now => {
      const dt = Math.min(40, now - last); last = now;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of parts) {
        p.vy += .32 * dt / 16; p.vx *= .99; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.a += p.va; p.life -= dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 500));
        if (p.shape === 0) ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.r / 1.6, 0, 7); ctx.fill(); } else { ctx.fillRect(-p.r / 3, -p.r, p.r / 1.5, p.r * 2); }
        ctx.restore();
      }
      for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0 || parts[i].y > innerHeight + 40) parts.splice(i, 1);
      if (parts.length) requestAnimationFrame(loop); else { this._confRunning = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
    };
    requestAnimationFrame(loop);
  },

/* =========================================================
 *  GAMES — ミニゲームごとの処理
 *  各ゲームは run(G) を持ち、G.show() で画面を出し、
 *  終了時に G.finish(awards, stats, summaryHTML) を呼ぶ。
 *  得点の確定は Score.commit が1回だけ行う（やり直し時は未確定のまま破棄）。
 * ========================================================= */
'use strict';

/* セッション内でお題がかぶりにくいように取り出す */
function drawFromPool(poolKey, items, n, filter = () => true) {
  const s = Store.session; s.used = s.used || {};
  const used = new Set(s.used[poolKey] || []);
  let idx = items.map((_, i) => i).filter(i => filter(items[i]));
  let fresh = idx.filter(i => !used.has(i));
  if (fresh.length < n) { idx.forEach(i => used.delete(i)); fresh = idx; }
  const chosen = shuffle(fresh).slice(0, n);
  chosen.forEach(i => used.add(i)); s.used[poolKey] = Array.from(used); Store.save();
  return chosen.map(i => items[i]);
}
/* 開始プレイヤーを毎回ずらす */
function rotatedPlayers(offsetKey) {
  const s = Store.session; s.rot = s.rot || {};
  const k = s.rot[offsetKey] = ((s.rot[offsetKey] || 0) + 1) % Store.players.length;
  return Store.players.slice(k).concat(Store.players.slice(0, k));
}
const pointsList = (pts) => {
  const ps = Store.players.slice().sort((a, b) => (pts[b.id] || 0) - (pts[a.id] || 0));
  return `<div class="award-list">${ps.map((p, i) => `<div class="award" style="animation-delay:${i * .05}s">${avatarHTML(p, 'sm')}<div class="nm">${nameHTML(p)}</div><div class="pt ${(pts[p.id] || 0) ? '' : 'zero'}">+${pts[p.id] || 0}</div></div>`).join('')}</div>`;
};
const addPts = (acc, add) => { for (const k in add) acc[k] = (acc[k] || 0) + add[k]; return acc; };

const GAMES = {};

/* =========================================================
 *  1. 究極の二択酒場
 * ========================================================= */
GAMES.choice = {
  key: 'choice', title: '究極の二択酒場', color: '#ff4d5e', star: '看板',
  desc: '正解のない究極の二択。全員こっそり選んで一斉公開！ 理由トークで盛り上がろう。',
  time: '1お題 約1分', players: '3〜6人',
  rules: [
    '画面に究極の二択のお題が出ます。',
    '端末を順番に回して、1人ずつこっそり A か B を選びます（前の人の答えは見えません）。',
    '全員そろったら一斉に公開！ 多数派・少数派がわかります。',
    '「なんでそっち!?」と理由を話し合うのがこのゲームの醍醐味。どちらが正解ということはありません。',
    'ボーナス設定で、少数派や多数派にポイントを付けられます。'
  ],
  options: [
    { key: 'count', label: 'お題の数', type: 'seg', choices: [[1, '1問'], [3, '3問'], [5, '5問']], def: 3 },
    { key: 'bonus', label: 'ボーナスポイント', type: 'seg', choices: [['minority', '少数派に'], ['majority', '多数派に'], ['none', 'なし']], def: 'minority' },
    { key: 'genres', label: 'ジャンル（複数OK）', type: 'multi', choices: Object.entries(DATA.choiceGenres), def: Object.keys(DATA.choiceGenres) }
  ],
  run(G) {
    const set = G.settings;
    const topics = drawFromPool('choice', DATA.choices, set.count, c => set.genres.includes(c[0]));
    const st = { qi: 0, topics, answers: {}, order: [], total: {}, stats: {}, log: [] };

    const topicCard = (t, small) => `<div class="topic-card"><span class="genre">${esc(DATA.choiceGenres[t[0]])}</span>
      <div class="q" ${small ? 'style="font-size:16px"' : ''}>どっちを選ぶ？</div>
      ${small ? '' : `<div class="vs-wrap" style="margin-top:12px"><div class="rbar a"><div class="lab"><b>A：${esc(t[1])}</b></div></div><div class="vs">VS</div><div class="rbar b"><div class="lab"><b>B：${esc(t[2])}</b></div></div></div>`}</div>`;
    const chip = () => `<span class="chip">お題 ${st.qi + 1}/${topics.length}</span>`;

    const intro = () => {
      st.answers = {}; st.order = rotatedPlayers('choice');
      const t = topics[st.qi];
      G.show(`${topicCard(t)}
        <p class="lead center mt16">全員が<b style="color:var(--yellow)">こっそり</b> A か B を選びます。<br>端末を順番に回してね！</p>
        <div class="footer-actions"><button class="btn" data-act="go" data-sfx="confirm">回答スタート！</button></div>`,
        { go: () => pass(0) }, { chip: chip() });
    };
    const pass = (i, prev) => {
      const p = st.order[i];
      G.show(UI.pass(p, {
        msg: prev ? `${nameHTML(prev)}さんの回答を受け付けました。<br>端末を <b style="color:var(--ink)">${nameHTML(p)}さん</b> に渡してください。` : undefined,
        dots: UI.progressDots(st.order.length, i)
      }) + (prev ? `<button class="btn ghost sm" data-act="redo">← ${nameHTML(prev)}さん：今の回答を選び直す</button>` : ''),
        { ready: () => answer(i), redo: () => { delete st.answers[prev.id]; answer(i - 1); } }, { chip: chip() });
    };
    const answer = (i) => {
      const p = st.order[i]; const t = topics[st.qi];
      G.show(`<div class="row" style="justify-content:center;margin-bottom:10px">${avatarHTML(p, 'sm')}<b style="font-size:18px">${nameHTML(p)}さんの番</b></div>
        <div class="topic-card" style="padding:12px"><span class="genre">${esc(DATA.choiceGenres[t[0]])}</span><div class="q" style="font-size:17px;margin-top:4px">どっちを選ぶ？ タップで決定</div></div>
        <div class="vs-wrap">
          <button class="choice a" data-act="pick" data-v="A" data-sfx="confirm"><span class="tag">A</span>${esc(t[1])}</button>
          <div class="vs">VS</div>
          <button class="choice b" data-act="pick" data-v="B" data-sfx="confirm"><span class="tag">B</span>${esc(t[2])}</button>
        </div>`,
        {
          pick: d => {
            st.answers[p.id] = d.v;
            if (i + 1 < st.order.length) pass(i + 1, p); else allDone(p);
          }
        }, { chip: chip() });
    };
    const allDone = (last) => {
      G.show(`<div class="pass"><div class="who" style="font-size:30px">全員の回答が<br>そろいました！</div>
        <div class="msg">端末をテーブルの真ん中に置いて、<br>みんなで結果を見よう！</div>
        <button class="btn yellow" data-act="reveal" data-sfx="drum">結果を公開！</button>
        <button class="btn ghost sm" data-act="redo">← ${nameHTML(last)}さん：今の回答を選び直す</button></div>`,
        { reveal: drum, redo: () => { delete st.answers[last.id]; answer(st.order.length - 1); } }, { chip: chip() });
    };
    const drum = () => {
      G.show(`<div class="drum"><div><div class="big">ドゥルルル…</div><p class="dim mt16">A派とB派は…</p></div></div>`, {}, { chip: chip() });
      Timers.timeout(result, 1700);
    };
    const result = () => {
      const t = topics[st.qi];
      const A = st.order.filter(p => st.answers[p.id] === 'A'), B = st.order.filter(p => st.answers[p.id] === 'B');
      const n = st.order.length;
      const unanimous = A.length === 0 || B.length === 0;
      const tie = A.length === B.length;
      const minority = unanimous || tie ? [] : (A.length < B.length ? A : B);
      const majority = unanimous || tie ? [] : (A.length > B.length ? A : B);
      const lone = minority.length === 1;
      const pts = {}; const stats = {};
      if (set.bonus !== 'none' && unanimous) st.order.forEach(p => pts[p.id] = 50);
      if (set.bonus === 'minority' && minority.length) minority.forEach(p => pts[p.id] = lone ? 150 : 100);
      if (set.bonus === 'majority' && majority.length) majority.forEach(p => pts[p.id] = 60);
      minority.forEach(p => stats[p.id] = { minority: 1 });
      addPts(st.total, pts); for (const k in stats) st.stats[k] = { minority: ((st.stats[k] || {}).minority || 0) + 1 };
      st.log.push({ t, a: A.length, b: B.length });

      const label = side => unanimous ? (side.length ? '<span class="badge">全員一致</span>' : '') : tie ? '<span class="badge">同数</span>' : side === majority ? '<span class="badge">多数派</span>' : '<span class="badge minor">少数派</span>';
      const bar = (cls, letter, text, list) => `<div class="rbar ${cls}"><div class="fill" data-w="${n ? list.length / n * 100 : 0}"></div>
        <div class="lab"><b>${letter}：${esc(text)} ${label(list)}</b><span class="cnt">${list.length}<small style="font-size:14px">人</small></span></div>

/* お絵描きパッド：線は0〜1の正規化座標で保持し、リサイズ・回転時に描き直す */
function DrawPad(box) {
  const cv = document.createElement('canvas'); box.appendChild(cv);
  const ctx = cv.getContext('2d');
  const PAPER = '#fffdf6';
  const pad = { strokes: [], color: '#222222', width: 1, eraser: false, enabled: true };
  const WIDTHS = [0.008, 0.018, 0.036];
  let W = 0, H = 0, cur = null, rect = null;
  const lw = s => WIDTHS[s.w] * W;
  function resize() {
    const r = box.getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redraw();
  }
  function strokePath(c, s, w, h, scale) {
    c.strokeStyle = s.e ? PAPER : s.c; c.fillStyle = c.strokeStyle; c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = WIDTHS[s.w] * w * (s.e ? 2.2 : 1);
    const p = s.p;
    if (p.length === 1) { c.beginPath(); c.arc(p[0][0] * w, p[0][1] * h, c.lineWidth / 2, 0, Math.PI * 2); c.fill(); return; }
    c.beginPath(); c.moveTo(p[0][0] * w, p[0][1] * h);
    for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; c.quadraticCurveTo(p[i][0] * w, p[i][1] * h, mx * w, my * h); }
    const l = p[p.length - 1]; c.lineTo(l[0] * w, l[1] * h); c.stroke();
  }
  function redraw() { ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); pad.strokes.forEach(s => strokePath(ctx, s, W, H)); if (cur) strokePath(ctx, cur, W, H); }
  const pos = e => [Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)), Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height))];
  cv.addEventListener('pointerdown', e => {
    if (!pad.enabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault(); rect = cv.getBoundingClientRect();
    try { cv.setPointerCapture(e.pointerId); } catch (_) { }
    cur = { c: pad.color, w: pad.width, e: pad.eraser, p: [pos(e)], id: e.pointerId }; redraw();
  });
  cv.addEventListener('pointermove', e => {
    if (!cur || e.pointerId !== cur.id) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach(ev => cur.p.push(pos(ev)));
    // 直近の区間だけ追加描画（軽量）
    const p = cur.p, n = p.length; if (n < 2) return;
    ctx.strokeStyle = cur.e ? PAPER : cur.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = WIDTHS[cur.w] * W * (cur.e ? 2.2 : 1);
    ctx.beginPath(); const from = Math.max(0, n - 1 - evs.length); ctx.moveTo(p[from][0] * W, p[from][1] * H);
    for (let i = from + 1; i < n; i++) ctx.lineTo(p[i][0] * W, p[i][1] * H); ctx.stroke();
  });
  const end = e => { if (!cur || (e && e.pointerId !== cur.id)) return; pad.strokes.push(cur); cur = null; redraw(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
  cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  const ro = window.ResizeObserver ? new ResizeObserver(resize) : null; if (ro) ro.observe(box); else window.addEventListener('resize', resize);
  resize();
  pad.undo = () => { pad.strokes.pop(); redraw(); };
  pad.clear = () => { pad.strokes = []; redraw(); };
  pad.stop = () => { pad.enabled = false; if (cur) end(); if (ro) ro.disconnect(); else window.removeEventListener('resize', resize); };
  pad.isEmpty = () => pad.strokes.filter(s => !s.e).length === 0;
  pad.toImage = (size = 520) => {
    const c2 = document.createElement('canvas'); c2.width = c2.height = size; const x = c2.getContext('2d');
    x.fillStyle = PAPER; x.fillRect(0, 0, size, size); pad.strokes.forEach(s => strokePath(x, s, size, size));
    return c2.toDataURL('image/png');
  };
  pad.resize = resize;
  return pad;
}

      };
    };

      const pts = {}; const drawer = st.drawer;

      addPts(st.total, pts);
      st.stats[drawer.id] = { drawPts: ((st.stats[drawer.id] || {}).drawPts || 0) + pts[drawer.id] };
      st.arts.push({ img: st.img, word: st.word[1], drawer, correct: correctIds.length, of: guessers().length });
      if (correctIds.length) { Sound.play('correct'); if (all) UI.confetti(1400, 80); } else Sound.play('wrong');
      const isLast = st.di + 1 >= drawers.length;
      G.show(`<div class="center"><div class="verdict ${correctIds.length ? 'ok' : 'ng'}">${all ? '全員正解！！' : correctIds.length ? `${correctIds.length}人が正解！` : '正解者なし…'}</div>
          <p class="dim">お題「${esc(st.word[1])}」 / ${nameHTML(drawer)}さんの作品</p></div>
        <div class="panel mt16"><h3>獲得ポイント</h3>${pointsList(pts)}</div>
        <div class="footer-actions"><button class="btn ${isLast ? 'yellow' : ''}" data-act="next">${isLast ? '結果まとめへ' : '次の人が描く'}</button></div>`,
        { next: () => { if (isLast) finish(); else { st.di++; pass(); } } }, { chip: chip() });
    };
    const finish = () => {
      const summary = `<div class="gallery">${st.arts.map(a => `<figure><div class="art"><img src="${a.img}" alt="${esc(a.word)}"></div><figcaption>${nameHTML(a.drawer)}作「${esc(a.word)}」<br><span class="dim">正解 ${a.correct}/${a.of}</span></figcaption></figure>`).join('')}</div>`;
      G.finish(st.total, st.stats, summary);
    };
    pass();
  }
};
function isDrawMatch(text, word) {
  const g = normalizeAnswer(text); if (!g) return false;
  const cands = [word[1], ...(word[2] || [])].map(normalizeAnswer).filter(Boolean);
  return cands.some(c => c === g || (c.length >= 2 && g.includes(c)) || (g.length >= 2 && c.includes(g) && g.length >= c.length * .6));
}

    let cands = Store.players.filter(p => p.id !== s.lastTraitor); if (!cands.length) cands = Store.players;
    const traitor = pick(cands);
    const mission = drawFromPool('mission', DATA.missions, 1)[0];
    const theme = pick(DATA.talkThemes);

    const rolePass = (i) => {
      const p = order[i];

    };
    const roleCard = (i) => {
      const p = order[i];
      G.show(`<p class="center" style="font-weight:900;margin:0 0 12px">${nameHTML(p)}さんの役割カード</p>
        <div class="role-card" id="rc"><div class="role-inner">
          <button class="role-face back" data-act="flip" data-sfx="whoosh" style="width:100%"><span style="font-size:52px">？</span><b>タップしてめくる</b><span class="dim small">自分だけで見てね</span></button>

        <div class="footer-actions" id="ra" style="visibility:hidden"><button class="btn purple" data-act="hide" data-sfx="pass">確認した（隠して次へ）</button></div>`,
        {
          flip: () => {
            // めくった時点で初めて中身を描画（事前にDOMへ入れない）
            const f = $('#rf');
            if (p.id === traitor.id) {
              f.className = 'role-face front traitor';
              f.innerHTML = `<div class="dim small" style="color:#ffc9d2">あなたは…</div><div class="rname">裏切り者</div>
                <div class="mission">${esc(mission.t)}</div><div class="hint">ヒント：${esc(mission.h)}</div><div class="small">バレないように達成しよう！</div>`;
            } else {
              f.className = 'role-face front citizen';
              f.innerHTML = `<div class="dim small">あなたは…</div><div class="rname">横丁の住人</div>
                <div class="mission" style="font-size:16px">この中に<b style="color:var(--red)">裏切り者</b>がいる…<br>会話をよく観察して見抜こう！</div><div class="small dim">怪しい行動をした人を覚えておこう</div>`;
            }
            $('#rc').classList.add('flip');
            Timers.timeout(() => { const ra = $('#ra'); if (ra) ra.style.visibility = 'visible'; }, 650);
          },
          hide: () => { if (i + 1 < order.length) rolePass(i + 1); else talkReady(); }
        }, { chip: chip('役割チェック') });
    };
    const talkReady = () => {
      G.show(`<div class="pass"><div class="who" style="font-size:28px">全員の確認が<br>終わりました</div>
        <div class="panel" style="width:100%"><p class="dim small" style="margin:0">トークテーマ</p><div style="font-family:var(--font-head);font-size:24px;margin-top:4px">${esc(theme)}</div></div>
        <p class="msg">端末をテーブルの真ん中に置いて、<br>${set.time}秒間 自由に話そう！</p>
        <button class="btn" data-act="go" data-sfx="confirm">トーク開始！</button></div>`, { go: talk }, { chip: chip('準備OK') });
    };
    const talk = () => {
      const C = 2 * Math.PI * 88;
      G.show(`<div class="center"><p class="dim small" style="margin:0">トークテーマ</p><div style="font-family:var(--font-head);font-size:22px">${esc(theme)}</div></div>
        <div class="ring mt16"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" stroke="rgba(255,255,255,.1)" stroke-width="14" fill="none"/>
          <circle id="arc" cx="100" cy="100" r="88" stroke="url(#gr)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>
          <defs><linearGradient id="gr"><stop offset="0" stop-color="#2ee6c5"/><stop offset="1" stop-color="#a46bff"/></linearGradient></defs></svg>
          <div class="big-timer" id="bt">${set.time}</div></div>
        <p class="lead center">この中に<b style="color:var(--red)">裏切り者</b>がいる…</p>
        <div class="footer-actions"><div class="btn-row"><button class="btn ghost sm" data-act="add" data-multi>＋30秒</button><button class="btn purple sm" data-act="end">投票へ進む</button></div></div>`,
        {
          add: () => { timer.stop(); left += 30; total += 30; startTimer(left); UI.toast('30秒延長！'); },
          end: async (d, el) => { if (await UI.confirm('トークを終了しますか？', '投票に進みます。', '投票へ', 'まだ話す', false)) { timer.stop(); votePass(0); } else el.dataset.used = ''; }
        }, { chip: chip('トーク中') });
      let left = set.time, total = set.time, timer;
      const startTimer = (sec) => {
        timer = countdown(sec, (l) => {
          left = l; const bt = $('#bt'); if (!bt) return; bt.textContent = Math.ceil(l); bt.classList.toggle('warn', l <= 10);
          $('#arc').setAttribute('stroke-dashoffset', C * (1 - l / total));
        }, () => { Sound.play('buzzer'); timeUp(); });
      };
      startTimer(left);
    };
    const timeUp = () => {
      G.show(`<div class="pass"><div class="who" style="font-size:40px;color:var(--red)">タイムアップ！</div><p class="msg">いよいよ投票タイム。<br>1人ずつこっそり投票しよう。</p><button class="btn purple" data-act="go">投票を始める</button></div>`,
        { go: () => votePass(0) }, { chip: chip('投票') });
    };
    const votePass = (i) => {
      const p = order[i];
      G.show(UI.pass(p, { msg: `${nameHTML(p)}さんの投票番です。<br>ほかの人の投票は見えません。`, dots: UI.progressDots(order.length, i) }),
        { ready: () => vote(i) }, { chip: chip('投票') });
    };
    const vote = (i) => {
      const p = order[i]; let sel = null;
      const others = Store.players.filter(x => x.id !== p.id);
      G.show(`<p class="center" style="font-weight:900;font-size:18px;margin:0 0 12px">${nameHTML(p)}さん、裏切り者は誰？</p>
        <div class="pick-grid">${others.map(o => `<button class="pick bad" data-act="sel" data-multi data-id="${o.id}">${avatarHTML(o, 'sm')}${nameHTML(o)}</button>`).join('')}</div>
        <div class="footer-actions"><button class="btn purple disabled" id="vb" data-act="cast" data-sfx="confirm">この人に投票</button></div>`,
        {
          sel: (d, el) => { sel = d.id; $$('.pick').forEach(b => b.classList.toggle('on', b === el)); $('#vb').classList.remove('disabled'); Sound.play('tap'); },
          cast: () => { if (!sel) return; st.votes[p.id] = sel; if (i + 1 < order.length) votePass(i + 1); else allVoted(); }
        }, { chip: chip('投票') });
    };
    const allVoted = () => {
      G.show(`<div class="pass"><div class="who" style="font-size:30px">全員の投票が<br>完了しました</div><p class="msg">端末をみんなが見える場所に置いて…</p>
        <button class="btn" data-act="go" data-sfx="drum">裏切り者の正体を明かす</button></div>`, { go: revealDrum }, { chip: chip('正体発表') });
    };
    const revealDrum = () => {
      G.show(`<div class="drum"><div><div class="big">裏切り者は…</div></div></div>`, {}, { chip: chip('正体発表') });
      Timers.timeout(reveal, 1900);
    };
    const tally = () => {
      const t = {}; Store.players.forEach(p => t[p.id] = []);
      Object.entries(st.votes).forEach(([voter, target]) => t[target].push(voter));
      return t;
    };
    const reveal = () => {
      const t = tally(); const n = Object.keys(st.votes).length;
      Sound.play('reveal'); Timers.timeout(() => Sound.play('ominous'), 200);
      const rows = Store.players.slice().sort((a, b) => t[b.id].length - t[a.id].length).map(p => `<div class="vt ${p.id === traitor.id ? 'is-traitor' : ''}">${avatarHTML(p, 'xs')}<b style="min-width:5em">${nameHTML(p)}</b><div class="bar"><i data-w="${n ? t[p.id].length / n * 100 : 0}"></i></div><span class="n">${t[p.id].length}</span></div>`).join('');
      G.show(`<div class="reveal-traitor"><div class="spot">${avatarHTML(traitor, 'xl')}</div>
          <div style="font-family:var(--font-head);font-size:clamp(28px,8vw,40px);margin-top:6px"><span style="color:var(--red)">${nameHTML(traitor)}</span>さん！</div></div>
        <div class="panel mt16"><h3>秘密のミッション</h3><p class="lead" style="margin:0;font-weight:900">${esc(mission.t)}</p></div>
        <div class="panel mt16"><h3>投票結果</h3><div class="vote-tally">${rows}</div></div>
        <div class="panel mt16 neon"><h3>${nameHTML(traitor)}さん、ミッションは？</h3><p class="note" style="margin:0 0 10px">本人が申告し、みんなが納得したら確定します。</p>
          <div class="btn-row"><button class="btn teal sm" data-act="claim" data-v="1">成功した！</button><button class="btn ghost sm" data-act="claim" data-v="0">失敗した…</button></div></div>`,
        { claim: d => confirmClaim(d.v === '1') }, {
          chip: chip('正体発表'), mount: () => { UI.confetti(900, 50); Timers.timeout(() => $$('.vt .bar i').forEach(i => i.style.width = i.dataset.w + '%'), 80); }
        });
    };
    const confirmClaim = (ok) => {
      G.show(`<div class="pass"><div class="msg">${nameHTML(traitor)}さんの申告</div>
        <div class="who" style="color:${ok ? 'var(--teal)' : 'var(--dim)'}">ミッション${ok ? '成功！' : '失敗…'}</div>
        <div class="panel" style="width:100%"><p class="lead" style="margin:0">ミッション：<b>${esc(mission.t)}</b></p></div>
        <p class="msg">みんな、この申告に納得できる？<br>話し合って決めよう！</p>
        <button class="btn yellow" data-act="ok" data-sfx="confirm">みんな納得！確定する</button>
        <button class="btn ghost sm" data-act="back">申告をやり直す</button></div>`,
        { ok: () => score(ok), back: reveal }, { chip: chip('判定') });
    };
    const score = (success) => {
      const t = tally(); const caughtBy = t[traitor.id]; const escaped = caughtBy.length === 0;
      const pts = {}; const stats = {};
      pts[traitor.id] = (success ? 150 : 0) + (escaped ? 100 : 0);
      if (success || escaped) stats[traitor.id] = { schemer: 1 };
      caughtBy.forEach(v => { pts[v] = 100; stats[v] = { detect: 1 }; });
      s.lastTraitor = traitor.id; Store.save();
      const traitorWins = success && escaped;
      const headline = traitorWins ? '裏切り者の完全勝利！' : success ? 'ミッション成功！でも正体はバレた' : escaped ? '逃げ切り成功…！' : '住人チームの勝利！';
      if (traitorWins || (!success && !escaped)) Sound.play('fanfare'); else Sound.play('correct');
      UI.confetti(1800, 120);
      const summary = `<div class="row">${avatarHTML(traitor, 'lg')}<div><div style="font-weight:900;font-size:18px">裏切り者：${nameHTML(traitor)}さん</div><div class="dim small">${esc(mission.t)}</div><div class="small" style="margin-top:4px;color:var(--yellow);font-weight:900">${headline}（ミッション${success ? '成功' : '失敗'}・${caughtBy.length}票）</div></div></div>`;
      G.show(`<div class="center"><div class="verdict ${traitorWins ? 'ng' : 'ok'}" style="font-size:clamp(26px,8vw,36px)">${headline}</div></div>
        <div class="panel mt16">${summary}</div>
        <div class="panel mt16"><h3>獲得ポイント</h3>${pointsList(pts)}</div>
        <div class="footer-actions"><button class="btn yellow" data-act="fin">結果まとめへ</button></div>`,
        { fin: () => G.finish(pts, stats, summary) }, { chip: chip('結果') });
    };
    rolePass(0);
  }
};

 *  4. 以心伝心チャレンジ

GAMES.sync = {
  key: 'sync', title: '以心伝心チャレンジ', color: '#ffd23f',
  desc: '同じ質問にみんなで回答。答えがそろうほど高得点！ 心はひとつになれるか？',
  time: '1問 約40秒', players: '3〜6人',
  rules: [
    '全員に同じ質問が出ます。端末を回して、1人ずつこっそり答えを選びます。',
    '全員の答えを一斉公開！ 同じ答えの人が多いほど得点アップ。',
    '得点：同じ答えの仲間1人につき＋30点。全員一致なら全員にさらに＋100点！',
    '「自由入力」では、ひらがな・カタカナなどの表記ゆれは自動でそろえます。同じ意味の答えは手動でまとめることもできます。'
  ],
  options: [
    { key: 'count', label: '問題数', type: 'seg', choices: [[3, '3問'], [5, '5問']], def: 3 },
    { key: 'kind', label: '回答方式', type: 'seg', choices: [['choice', '選択肢のみ'], ['mix', '自由入力もあり']], def: 'choice' }
  ],
  run(G) {
    const set = G.settings;
    const qs = drawFromPool('sync', DATA.syncQs, set.count, q => set.kind === 'mix' || q.type !== 'free');
    const st = { qi: 0, total: {}, stats: {}, log: [] };
    const chip = () => `<span class="chip">${st.qi + 1}/${qs.length}問</span>`;

    const intro = () => {
      st.ans = {}; st.order = rotatedPlayers('sync');
      const q = qs[st.qi];
      G.show(`<div class="qcard" style="border-color:rgba(255,210,63,.5)"><span class="badge" style="margin:0">${q.type === 'free' ? '自由入力' : '選択式'}</span><div class="qtext mt8">${esc(q.q)}</div></div>
        <p class="lead center mt16">みんなと<b style="color:var(--yellow)">同じ答え</b>になりそうなものを選ぼう！<br><span class="dim small">相談はナシ！</span></p>
        <div class="footer-actions"><button class="btn yellow" data-act="go" data-sfx="confirm">回答スタート！</button></div>`,
        { go: () => pass(0) }, { chip: chip() });
    };
    const pass = (i) => {
      const p = st.order[i];
      G.show(UI.pass(p, { dots: UI.progressDots(st.order.length, i) }), { ready: () => answer(i) }, { chip: chip() });
    };
    const answer = (i) => {
      const p = st.order[i]; const q = qs[st.qi];
      const done = (v) => { st.ans[p.id] = v; i + 1 < st.order.length ? pass(i + 1) : revealDrum(); };
      if (q.type === 'free') {
        G.show(`<p class="center" style="font-weight:900">${nameHTML(p)}さんの番</p><div class="qcard"><div class="qtext">${esc(q.q)}</div></div>
          <input class="text-input mt16" id="fin" maxlength="16" placeholder="${esc(q.hint || '答えを入力')}" autocomplete="off">
          <div class="footer-actions"><button class="btn yellow" data-act="send" data-sfx="confirm">これで決定</button></div>`,
          { send: (d, el) => { const v = $('#fin').value.trim(); if (!v) { UI.toast('答えを入力してね'); el.dataset.used = ''; return; } done(v); } },
          { chip: chip(), mount: () => $('#fin').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $('[data-act=send]').click(); }) });
      } else {
        G.show(`<p class="center" style="font-weight:900">${nameHTML(p)}さんの番</p><div class="qcard"><div class="qtext">${esc(q.q)}</div></div>
          <div class="answers ${q.opts.length === 2 || q.opts.length === 4 ? 'two' : ''}">${q.opts.map((o, k) => `<button class="ans" data-act="pick" data-k="${k}" data-sfx="confirm"><span class="k">${'ABCDE'[k]}</span>${esc(o)}</button>`).join('')}</div>`,
          { pick: d => done(q.opts[+d.k]) }, { chip: chip() });
      }
    };
    const revealDrum = () => {
      G.show(`<div class="pass"><div class="who" style="font-size:30px">全員回答完了！</div><p class="msg">心はひとつになったかな…？</p><button class="btn yellow" data-act="go" data-sfx="drum">一斉公開！</button></div>`,
        { go: () => { G.show(`<div class="drum"><div class="big">せーの…！</div></div>`, {}, { chip: chip() }); Timers.timeout(result, 1500); } }, { chip: chip() });
    };
    const groupsOf = () => {
      const q = qs[st.qi]; const map = new Map();
      st.order.forEach(p => {
        const raw = st.ans[p.id]; const key = q.type === 'free' ? (st.merge[normalizeAnswer(raw)] || normalizeAnswer(raw)) : raw;
        if (!map.has(key)) map.set(key, { key, label: raw, members: [] });
        map.get(key).members.push(p);
      });
      return [...map.values()].sort((a, b) => b.members.length - a.members.length);
    };
    const result = () => {
      st.merge = {}; const sel = new Set();
      const q = qs[st.qi]; const n = st.order.length;
      const draw = (first) => {
        const gs = groupsOf(); const top = gs[0].members.length; const unanimous = gs.length === 1;
        const pts = {}; st.order.forEach(p => { const g = gs.find(x => x.members.includes(p)); pts[p.id] = (g.members.length - 1) * 30 + (unanimous ? 100 : 0); });
        st.cur = { gs, pts, unanimous };
        const tag = g => unanimous ? '全員一致！' : g.members.length > n / 2 ? '過半数一致' : g.members.length === 1 ? 'ひとりだけ' : g.members.length === top ? '最多' : '';
        const html = `<div class="qcard" style="padding:14px"><div class="qtext" style="font-size:18px">${esc(q.q)}</div></div>
          ${unanimous ? '<div class="special mt16"><b>全員一致！！</b>以心伝心！ 全員に＋100点ボーナス！</div>' : ''}
          <div class="groups mt16">${gs.map((g, gi) => `<${q.type === 'free' && !unanimous ? 'button data-act="sel" data-multi data-key="' + esc(g.key) + '"' : 'div'} class="group ${g.members.length === top && top > 1 ? 'top' : ''} ${sel.has(g.key) ? 'sel' : ''}" style="animation-delay:${first ? gi * .15 : 0}s;text-align:left;width:100%">
              <div class="gh"><span>${esc(g.label)} ${tag(g) ? `<span class="badge ${g.members.length === 1 ? 'minor' : ''}">${tag(g)}</span>` : ''}</span><span class="c">${g.members.length}人</span></div>
              <div class="row wrap mt8" style="gap:6px">${g.members.map(p => `<span class="chip" style="padding:3px 10px 3px 3px">${avatarHTML(p, 'xs')}${nameHTML(p)}</span>`).join('')}</div></${q.type === 'free' && !unanimous ? 'button' : 'div'}>`).join('')}</div>
          ${q.type === 'free' && !unanimous ? `<p class="note mt8">同じ意味の答えは、タップして選び「まとめる」を押すと同じ答えとして扱えます。</p><button class="btn ghost sm ${sel.size >= 2 ? '' : 'disabled'}" data-act="merge" data-multi>選んだ答えをまとめる</button>` : ''}
          <div class="panel mt16"><h3>この問題のポイント</h3>${pointsList(pts)}</div>
          <div class="footer-actions"><button class="btn ${st.qi + 1 >= qs.length ? 'yellow' : ''}" data-act="next">${st.qi + 1 >= qs.length ? '結果まとめへ' : '次の問題へ'}</button></div>`;
        G.show(html, {
          sel: (d) => { sel.has(d.key) ? sel.delete(d.key) : sel.add(d.key); Sound.play('tap'); draw(false); },
          merge: () => { if (sel.size < 2) return; const keys = [...sel]; const root = keys[0]; Object.keys(st.merge).forEach(k => { if (keys.includes(st.merge[k])) st.merge[k] = root; }); keys.forEach(k => st.merge[k] = root); sel.clear(); Sound.play('pop'); draw(false); },
          next: () => {
            const { pts, gs } = st.cur; addPts(st.total, pts);
            st.order.forEach(p => { const g = gs.find(x => x.members.includes(p)); st.stats[p.id] = { syncMatch: ((st.stats[p.id] || {}).syncMatch || 0) + g.members.length - 1 }; });
            st.log.push({ q: q.q, top: gs[0].label, topN: gs[0].members.length, n });
            if (st.qi + 1 >= qs.length) finish(); else { st.qi++; intro(); }
          }
        }, { chip: chip(), mount: () => { if (first) { Sound.play(unanimous ? 'unanimous' : 'reveal'); if (unanimous) UI.confetti(1500, 100); } } });
      };
      draw(true);
    };
    const finish = () => {
      const summary = `<div class="stack">${st.log.map(l => `<div class="award"><div class="nm">${esc(l.q)}<small>最多回答「${esc(l.top)}」</small></div><div class="pt" style="font-size:16px;color:var(--ink)">${l.topN}/${l.n}人</div></div>`).join('')}</div>`;
      G.finish(st.total, st.stats, summary);
    };
    intro();
  }
};

    const pass = () => {
      const p = who();
      G.show(UI.pass(p, { msg: `${nameHTML(p)}さんの挑戦！<br>制限時間は <b style="color:var(--yellow)">${set.time}秒</b>。`, btn: 'スタート！', shield: '', dots: UI.progressDots(qs.length, st.i) }),
        { ready: ask }, { chip: chip() });
    };
    const ask = () => {
      const p = who(); const q = qs[st.i];
      // 選択肢の順番をシャッフル（正解indexを追跡）
      const perm = shuffle(q.o.map((_, k) => k));
      let answered = false;
      G.show(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="row">${avatarHTML(p, 'sm')}<b>${nameHTML(p)}さん</b></span><span class="chip">${esc(q.c)}</span></div>
        <div class="timer-bar" id="qt"><i></i></div>
        <div class="big-timer mt8" id="qs" style="font-size:54px">${set.time}</div>
        <div class="qcard mt8"><div class="qtext">${esc(q.q)}</div></div>
        <div class="answers ${q.o.length === 4 ? 'two' : ''}" id="ans">${perm.map((k, j) => `<button class="ans" data-act="pick" data-k="${k}" data-sfx="none"><span class="k">${'ABCD'[j]}</span>${esc(q.o[k])}</button>`).join('')}</div>
        <div id="fb"></div>`,
        { pick: d => judge(+d.k) }, { chip: chip() });
      const timer = countdown(set.time, (l, f) => { const i = $('#qt i'); if (i) i.style.transform = `scaleX(${f})`; $('#qt').classList.toggle('warn', l <= 3); const s = $('#qs'); if (s) { s.textContent = Math.ceil(l); s.classList.toggle('warn', l <= 3); } },
        () => judge(null));
      const judge = (k) => {
        if (answered) return; answered = true;
        const left = timer.done ? 0 : Math.ceil(Math.max(0, set.time - (performance.now() - t0) / 1000));
        timer.stop();
        const ok = k === q.a;
        const pts = ok ? 100 + left * 10 : 0;
        st.total[p.id] = (st.total[p.id] || 0) + pts;
        if (ok) { st.correct[p.id] = (st.correct[p.id] || 0) + 1; Sound.play('correct'); } else Sound.play(k === null ? 'buzzer' : 'wrong');
        $$('#ans .ans').forEach(b => { b.disabled = true; const bk = +b.dataset.k; if (bk === q.a) b.classList.add('correct'); else if (bk === k) b.classList.add('wrong'); else b.classList.add('fade'); });
        const isLast = st.i + 1 >= qs.length;
        $('#fb').innerHTML = `<div class="verdict ${ok ? 'ok' : 'ng'} mt16">${ok ? `正解！ +${pts}` : k === null ? '時間切れ！' : '残念！'}</div>
          <p class="center dim" style="margin:6px 0 0">${esc(q.e)}</p>
          <div class="footer-actions"><button class="btn ${isLast ? 'yellow' : ''}" data-act="next">${isLast ? '結果まとめへ' : '次の問題へ'}</button></div>`;
        UI.handlers.next = () => { if (isLast) finish(); else { st.i++; pass(); } };
        $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
      const t0 = performance.now();
    };
    const finish = () => {
      Store.players.forEach(p => { if (st.correct[p.id]) st.stats[p.id] = { quizCorrect: st.correct[p.id] }; });
      const summary = `<div class="award-list">${order.map(p => `<div class="award">${avatarHTML(p, 'sm')}<div class="nm">${nameHTML(p)}</div><div class="pt" style="font-size:18px;color:var(--ink)">${st.correct[p.id] || 0}/${set.per}問正解</div></div>`).join('')}</div>`;
      G.finish(st.total, st.stats, summary);
    };
    pass();
  }
};

            <input data-i="${i}" maxlength="10" value="${esc(p.name)}" placeholder="プレイヤー${i + 1}" aria-label="プレイヤー${i + 1}の名前">

        <p class="note mt8">アバターをタップすると変更できます。名前が空欄なら「プレイヤー1」のように自動で付きます。</p>
        <div class="footer-actions"><button class="btn" data-act="check" data-multi data-sfx="confirm">登録内容を確認</button></div>`,
        {
          ...this.common(),
          plus: () => { if (draft.length < 6) { addOne(); render(); } },
          minus: () => { if (draft.length > 3) { draft.pop(); render(); } },
          del: d => { if (draft.length > 3) { draft.splice(+d.i, 1); render(); } },
          ava: d => pickAvatar(+d.i),

        }, {

        });
    };
    const pickAvatar = (i) => {
      UI.modal(`<h2>アバターを選ぶ</h2><div class="ava-picker">${DATA.avatars.map(a => {
        const usedBy = draft.find((p, j) => j !== i && p.avatar === a.id);
        return `<div><button data-act="set" data-id="${a.id}" class="${draft[i].avatar === a.id ? 'on' : ''}" ${usedBy ? 'disabled' : ''}><span class="ava" style="--c:${a.bg}">${a.glyph}</span></button><div class="label">${esc(a.name)}</div></div>`;
      }).join('')}</div><button class="btn ghost sm mt16" data-act="close">閉じる</button>`,
        { set: d => { draft[i].avatar = d.id; UI.closeModal(); render(); }, close: () => UI.closeModal() });
    };

      draft.forEach((p, i) => { p.name = (p.name || '').trim() || `プレイヤー${i + 1}`; });
      const changed = draft.map(p => p.id).sort().join() !== Store.players.map(p => p.id).sort().join();
      const warn = changed && Store.hasProgress;
      UI.modal(`<h2>登録内容の確認</h2>
        <div class="award-list">${draft.map((p, i) => `<div class="award">${avatarHTML(p, 'sm')}<div class="nm">${esc(p.name)}<small>${i + 1}番目</small></div></div>`).join('')}</div>

        {

  /* ---------------- ゲーム開始前：ルール確認と設定 ---------------- */
  intro(key) {
    if (Store.players.length < 3) return this.setup('intro:' + key);
    this.inGame = false;
    const g = GAMES[key];
    Store.settings.games = Store.settings.games || {};
    const saved = Store.settings.games[key] || {};
    const set = {};
    g.options.forEach(o => {
      let v = saved[o.key];
      if (o.type === 'multi') { v = Array.isArray(v) ? v.filter(x => o.choices.some(c => c[0] === x)) : null; if (!v || !v.length) v = o.def.slice(); }
      else if (!o.choices.some(c => c[0] === v)) v = o.def;
      set[o.key] = v;
    });
    const optHTML = o => o.type === 'multi'
      ? `<div class="pill-set">${o.choices.map(([v, l]) => `<button class="pill ${set[o.key].includes(v) ? 'on' : ''}" data-act="multi" data-multi data-k="${o.key}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`
      : `<div class="seg">${o.choices.map(([v, l]) => `<button class="${set[o.key] === v ? 'on' : ''}" data-act="opt" data-multi data-k="${o.key}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;
    UI.show(`${topbar({ left: 'back', title: g.title, sub: `${g.time}・${g.players}` })}
      <div class="panel neon" style="display:flex;gap:14px;align-items:center"><span class="gicon" style="--mc:${g.color}">${ICON.modes[key]}</span>

      <div class="panel mt16"><h2>設定</h2>${g.options.map(o => `<div class="field-label">${esc(o.label)}</div>${optHTML(o)}`).join('')}</div>

      <div class="footer-actions"><button class="btn" data-act="start" data-sfx="confirm">ゲーム開始！</button></div>`,
      {
        ...this.common(),
        opt: (d, el) => {
          const o = g.options.find(x => x.key === d.k); const c = o.choices.find(c => String(c[0]) === d.v);
          set[d.k] = c[0]; $$(`[data-act=opt][data-k=${d.k}]`).forEach(b => b.classList.toggle('on', b === el)); Sound.play('tap');
        },
        multi: (d, el) => {
          const arr = set[d.k]; const i = arr.indexOf(d.v);
          if (i >= 0) { if (arr.length === 1) { UI.toast('1つ以上選んでね'); return; } arr.splice(i, 1); } else arr.push(d.v);
          el.classList.toggle('on', i < 0); Sound.play('tap');

      });
