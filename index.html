  /* ---------------- 画面D：ゲームプレイの共通枠 ---------------- */
  start(key, settings) {
    const game = GAMES[key];
    const screenAtStart = UI.screenNo;
    const G = {
      key, settings: JSON.parse(JSON.stringify(settings)), roundId: uid(key), finished: false,
      show(html, handlers = {}, opt = {}) {
        const mult = Store.session.multiplier > 1 ? '<span class="chip x2">×2</span>' : '';
        const top = `<div class="topbar"><button class="icon-btn" data-act="gBack" aria-label="中断して戻る">${ICON.back}</button>
          <div class="title">${esc(game.title)}</div>${opt.chip || ''}${mult}<button class="icon-btn" data-act="gMenu" aria-label="メニュー">${ICON.menu}</button></div>`;
        return UI.show(top + html, { ...handlers, gBack: (d, el) => App.abortAsk(el), gMenu: (d, el) => App.gameMenu(G, el) }, opt);
      },
      finish(awards, stats, summary) {
        if (G.finished) return; G.finished = true; App.inGame = false;
        const rec = Score.commit(G.roundId, key, awards, stats, { title: game.title });
        App.roundResult(rec, summary, key);
      }
    };
    this.current = { key, settings: G.settings };
    UI.curtain(game.title).then(() => {
      if (UI.screenNo !== screenAtStart) return; // 待機中に別画面へ移動した
      this.inGame = true;
      try { game.run(G); } catch (e) { console.error(e); this.inGame = false; UI.toast('エラーが発生しました'); this.modes(); }
    });
  },
  async abortAsk(el) {
    const ok = await UI.confirm('ゲームを中断しますか？', 'このゲームの途中経過は保存されず、得点も加算されません。', '中断する', '続ける');
    if (ok) { this.inGame = false; this.modes(); } else if (el) el.dataset.used = '';
  },
  gameMenu(G, el) {
    if (el) el.dataset.used = '';
    const g = GAMES[G.key];
    UI.modal(`<h2>メニュー</h2>
      <div class="stack">
        <button class="btn ghost sm" data-act="rules">ルールを確認</button>
        <button class="btn ghost sm" data-act="restart">このゲームを最初からやり直す</button>
        <button class="btn ghost sm" data-act="abort">中断してゲーム選択へ</button>
        <div class="sound-row" style="margin:4px 0">${UI.soundToggles()}</div>
        <button class="btn sm" data-act="close">ゲームに戻る</button></div>`,
      {
        ...UI.soundHandlers(),
        close: () => UI.closeModal(),
        rules: () => UI.modal(`<h2>${esc(g.title)}のルール</h2><ol class="rule-list">${g.rules.map((r, i) => `<li><b class="n">${i + 1}</b><span>${esc(r)}</span></li>`).join('')}</ol><button class="btn sm mt16" data-act="close">閉じる</button>`, { close: () => UI.closeModal() }),
        restart: async () => {
          if (await UI.confirm('最初からやり直しますか？', 'このゲームの途中経過は破棄されます（得点は加算されません）。お題は新しくなります。', 'やり直す', 'やめる')) {
            this.inGame = false; this.start(G.key, G.settings);
          }
        },
        abort: () => { UI.closeModal(); this.abortAsk(); }
      });
  },

  /* ---------------- 画面E：結果・ランキング ---------------- */
  roundResult(rec, summary, key) {
    this.inGame = false;
    const g = GAMES[key];
    const ps = Store.players.slice().sort((a, b) => rec.awards[b.id] - rec.awards[a.id]);
    UI.show(`${topbar({ left: 'home', title: '結果発表', sub: esc(g.title), right: `<button class="icon-btn" data-act="rank" aria-label="ランキング">${ICON.trophy}</button>` })}
      <div class="panel"><h2>ゲームの結果</h2>${summary}</div>
      <div class="panel neon mt16"><h2>獲得ポイント${rec.mult > 1 ? ' <span class="chip x2" style="font-size:12px">2倍適用！</span>' : ''}</h2>
        <div class="award-list">${ps.map((p, i) => `<div class="award" style="animation-delay:${i * .07}s">${avatarHTML(p, 'sm')}<div class="nm">${nameHTML(p)}${rec.winners.includes(p.id) ? '<span class="badge">トップ</span>' : ''}</div><div class="pt ${rec.awards[p.id] ? '' : 'zero'}">+${rec.awards[p.id]}</div></div>`).join('')}</div></div>
      <div class="panel mt16"><h2>総合ランキング</h2>${rankListHTML(rec.before)}</div>
      <div class="footer-actions">
        <button class="btn" data-act="next">次のゲームを選ぶ</button>
        <div class="btn-row"><button class="btn yellow sm" data-act="roulette">ルーレットで決める</button><button class="btn ghost sm" data-act="again">もう一度遊ぶ</button></div>
        <button class="btn purple sm" data-act="final">最終結果を発表する</button></div>`,
      {
        ...this.common(),
        next: () => this.modes(), roulette: () => this.roulette(), again: () => this.intro(key),
        final: () => this.final(), rank: () => this.standings()
      }, {
        mount: () => { if (rec.winners.length) { Sound.play('fanfare'); UI.confetti(2000, 120); } }
      });
  },
  standings() {
    this.inGame = false;
    const s = Store.session;
    const keys = ['choice', 'draw', 'traitor', 'sync', 'quiz'];
    const played = keys.filter(k => Store.players.some(p => s.games[p.id][k]));
    UI.show(`${topbar({ left: 'back', title: '総合ランキング', sub: `${s.history.length}ゲーム終了` })}
      ${rankListHTML()}
      ${played.length ? `<div class="panel mt16"><h2>ゲーム別の得点</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">
        <tr><th style="text-align:left;padding:6px">名前</th>${played.map(k => `<th style="padding:6px;font-size:12px;color:var(--dim)">${esc(GAMES[k].title.replace('チャレンジ', '').replace('ミッション', ''))}</th>`).join('')}</tr>
        ${Store.players.map(p => `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 6px;font-weight:900;white-space:nowrap">${nameHTML(p)}</td>${played.map(k => `<td style="text-align:center;font-weight:800">${s.games[p.id][k] ? s.games[p.id][k].points : '-'}</td>`).join('')}</tr>`).join('')}
      </table></div></div>` : '<p class="center dim mt16">まだゲームをしていません</p>'}
      <div class="footer-actions">
        <button class="btn" data-act="goBack">ゲーム選択へ</button>
        ${s.history.length ? '<button class="btn purple sm" data-act="final">最終結果を発表する</button>' : ''}
        <button class="btn ghost sm" data-act="reset">得点をリセット</button></div>`,
      {
        ...this.common(), final: () => this.final(),
        reset: async (d, el) => {
          if (await UI.confirm('得点をリセットしますか？', 'すべての得点・成績・称号の記録が0に戻ります（メンバーはそのまま）。', 'リセット', 'やめる')) { Store.newSession(); UI.toast('得点をリセットしました'); this.standings(); }
          else el.dataset.used = '';
        }
      });
  },
  /* 最終結果の表彰：最下位から順に発表 */
  final() {
    if (!Store.hasProgress) { UI.toast('まだゲームをしていません'); return; }
    this.inGame = false;
    const rk = Score.ranking();
    const ranks = [...new Set(rk.map(r => r.rank))].sort((a, b) => b - a); // 最下位から
    let step = -1;
    const opening = () => {
      UI.show(`${topbar({ left: 'back', title: '最終結果発表' })}
        <div class="pass"><div class="lantern-row">${ICON.lantern('#ff4d5e', '祝')}${ICON.lantern('#ffd23f', '宴')}${ICON.lantern('#ff4d5e', '祝')}</div>
        <div class="who">最終結果発表！</div><p class="msg">${Store.session.history.length}ゲームの激闘の結果…<br>最下位から順番に発表します！</p>
        <button class="btn yellow" data-act="go" data-sfx="drum">発表スタート！</button></div>`,
        { ...this.common(), go: nextStep });
    };
    const nextStep = () => {
      step++;
      if (step >= ranks.length) return titles();
      const rank = ranks[step]; const group = rk.filter(r => r.rank === rank); const first = rank === 1;
      UI.show(`<div class="drum"><div class="big">第${rank}位は…</div></div>`, {});
      Sound.play('drum');
      Timers.timeout(() => {
        UI.show(`${topbar({ left: 'none', title: '最終結果発表', sub: `${ranks.length - step}/${ranks.length}` })}
          <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:14px">
          ${group.map(r => `<div class="ceremony-card ${first ? 'first' : ''}">
            ${first ? `<span class="crown">${ICON.crown}</span>` : ''}
            <div class="place">${group.length > 1 ? '同率' : ''}第${rank}位</div>
            <div style="margin-top:10px">${avatarHTML(r.player, first ? 'xl' : 'lg')}</div>
            <div class="nm">${nameHTML(r.player)}</div><div class="sc">${r.score.toLocaleString()}<small style="font-size:16px">点</small></div>
            <div class="dim small">トップ獲得 ${r.wins}回</div></div>`).join('')}</div>
          <div class="footer-actions"><button class="btn ${first ? 'purple' : 'yellow'}" data-act="go">${first ? '称号の発表へ' : step + 1 < ranks.length - 1 ? '次の順位へ' : 'いよいよ1位の発表！'}</button>
          ${first ? '' : '<button class="btn ghost sm" data-act="skip">1位までスキップ</button>'}</div>`,
          { go: nextStep, skip: () => { step = ranks.length - 2; nextStep(); } },
          { mount: () => { if (first) { Sound.play('fanfare'); UI.confetti(3200, 220); Timers.timeout(() => UI.confetti(2400, 140), 900); } else Sound.play('reveal'); } });
      }, 1600);
    };
    const titles = () => {
      const ts = Score.titles();
      UI.show(`${topbar({ left: 'home', title: '表彰式', sub: '称号はプレイ結果に基づいて贈られます' })}
        <div class="panel neon"><h2>称号の授与</h2>
          ${ts.length ? `<div class="stack">${ts.map((t, i) => { const p = Store.player(t.pid); return `<div class="title-card" style="animation-delay:${i * .15}s">${avatarHTML(p, 'sm')}<div><div class="tt">${esc(t.title)}</div><div style="font-weight:900">${nameHTML(p)}</div><div class="why">${esc(t.why)}</div></div></div>`; }).join('')}</div>`
          : '<p class="dim">今回は称号の条件を満たした人がいませんでした。もっと遊んで称号を狙おう！</p>'}</div>
        <div class="panel mt16"><h2>最終順位</h2>${rankListHTML()}</div>
        <div class="footer-actions">
          <button class="btn" data-act="again">同じメンバーでもう一度（得点リセット）</button>
          <button class="btn ghost sm" data-act="cont">得点そのままで続ける</button>
          <button class="btn ghost sm" data-act="members">メンバーを変えて遊ぶ</button></div>`,
        {
          ...this.common(),
          again: async (d, el) => { if (await UI.confirm('得点をリセットして新しく始めますか？', 'メンバーはそのままで、得点と記録が0に戻ります。', '新しく始める', 'やめる', false)) { Store.newSession(); this.modes(); } else el.dataset.used = ''; },
          cont: () => this.modes(),
          members: () => this.setup('modes')
        }, { mount: () => { Sound.play('correct'); UI.confetti(1600, 100); } });
    };
    opening();
  },

  /* ---------------- 横丁ルーレット ---------------- */
  roulette() {
    if (Store.players.length < 3) return this.setup('roulette');
    this.inGame = false;
    const s = Store.session;
    const segs = [
      { key: 'choice', label: '二択', color: '#ff4d5e' }, { key: 'draw', label: 'お絵描き', color: '#20c4a6' },
      { key: 'traitor', label: '裏切り者', color: '#8b55f0' }, { key: 'sync', label: '以心伝心', color: '#f0b400' },
      { key: 'quiz', label: 'クイズ', color: '#3a8ff0' }, { key: 'bonus', label: 'ボーナス', color: '#ff7a2b' }
    ];
    const lastGame = s.recent[s.recent.length - 1], prevGame = s.recent[s.recent.length - 2];
    const resting = segs.filter(g => g.key === lastGame || (g.key === 'bonus' && s.lastSpin === 'bonus')).map(g => g.key);
    const weight = g => resting.includes(g.key) ? 0 : g.key === prevGame ? .5 : g.key === 'bonus' ? .8 : 1;
    const cx = 110, cy = 110, R = 104;
    const pt = (deg, r) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
    const wheel = segs.map((g, i) => {
      const a0 = i * 60 - 30, a1 = a0 + 60; const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
      const rest = resting.includes(g.key);
      return `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${g.color}" stroke="#1b1033" stroke-width="2.5"/>
        ${rest ? `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="rgba(10,8,30,.62)"/>` : ''}
        <g transform="rotate(${i * 60} ${cx} ${cy})"><text x="${cx}" y="${cy - 66}" text-anchor="middle" font-size="${g.label.length > 3 ? 12 : 14}" font-weight="900" fill="#fff" style="font-family:var(--font-body)">${g.label}</text>
        ${rest ? `<text x="${cx}" y="${cy - 48}" text-anchor="middle" font-size="9" font-weight="900" fill="#ffd23f">お休み</text>` : ''}</g>`;
    }).join('');
    const lights = Array.from({ length: 24 }, (_, i) => { const [x, y] = pt(i * 15, R + 2); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${i % 2 ? '#fff3c4' : '#ff9a3c'}"><animate attributeName="opacity" values="1;.3;1" dur="1s" begin="${(i % 2) * .5}s" repeatCount="indefinite"/></circle>`; }).join('');
    const hist = s.history.filter(h => h.gameKey !== 'bonus').slice(-5).map(h => `<span>${esc(h.title)}</span>`).join('');
    UI.show(`${topbar({ left: 'home', title: '横丁ルーレット', sub: '次のお楽しみは…？', right: `<button class="icon-btn" data-act="goBack" aria-label="ゲーム選択">${ICON.menu}</button>` })}
      ${s.multiplier > 1 ? '<div class="center"><span class="chip x2">次のゲームは得点2倍！</span></div>' : ''}
      <div class="wheel-box"><svg class="wheel-pointer" viewBox="0 0 40 46"><path d="M20 44L4 8a16 16 0 0132 0z" fill="#fff3c4" stroke="#3b1800" stroke-width="3"/></svg>
        <svg class="wheel" viewBox="0 0 220 220"><circle cx="110" cy="110" r="109" fill="#2a1450" stroke="#ffd23f" stroke-width="2"/><g id="wg">${wheel}</g>${lights}</svg>
        <div class="wheel-hub">横丁</div></div>
      <div id="rres"></div>
      ${hist ? `<p class="center dim small" style="margin:8px 0 4px">最近のゲーム</p><div class="history">${hist}</div>` : ''}
      <div class="footer-actions" id="ract"><button class="btn yellow" data-act="spin" data-sfx="none">ルーレットを回す！</button></div>`,
      {
        ...this.common(),
        spin: () => {
          const pool = segs.map((g, i) => ({ g, i, w: weight(g) })).filter(x => x.w > 0);
          let r = Math.random() * pool.reduce((a, b) => a + b.w, 0); let hit = pool[pool.length - 1];
          for (const x of pool) { if ((r -= x.w) <= 0) { hit = x; break; } }
          const target = 360 * 6 - hit.i * 60 + (Math.random() * 36 - 18);
          const wg = $('#wg'); const dur = 4300; const t0 = performance.now(); let lastSeg = -1;
          $('#ract').innerHTML = '<p class="center dim">回転中…</p>';
          Sound.play('whoosh');
          const frame = now => {
            const t = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - t, 4); const rot = target * e;
            wg.setAttribute('transform', `rotate(${rot.toFixed(2)} 110 110)`);
            const seg = Math.floor((rot + 30) / 60); if (seg !== lastSeg) { lastSeg = seg; Sound.play('spin'); }
            if (t < 1) Timers.raf(frame); else Timers.timeout(() => landed(hit.g), 350);
          };
          Timers.raf(frame);
        }
      }, { mount: () => { } });
    const landed = (g) => {
      s.lastSpin = g.key; Store.save();
      if (g.key === 'bonus') return bonus();
      Sound.play('reveal');
      const m = GAMES[g.key];
      $('#rres').innerHTML = `<div class="roulette-result"><div class="dim small">決定！</div><div class="rt">${esc(m.title)}</div></div>`;
      $('#ract').innerHTML = `<button class="btn" data-act="play" data-sfx="confirm">${esc(m.title)}で遊ぶ</button><button class="btn ghost sm" data-act="goBack">自分で選ぶ</button>`;
      UI.handlers.play = () => this.intro(g.key);
    };
    const bonus = () => {
      const rk = Score.ranking(); const allTie = rk.every(r => r.score === rk[0].score);
      const evs = DATA.bonusEvents.filter(e => !(e.id === 'underdog' && allTie) && !(e.id === 'double' && s.multiplier > 1));
      const ev = pick(evs); const roundId = uid('bonus');
      Sound.play('fanfare'); UI.confetti(1500, 100);
      const awards = {}; let detail = '';
      if (ev.id === 'double') { s.multiplier = 2; Store.save(); detail = '次に遊ぶミニゲームの獲得得点が2倍になります！'; }
      else if (ev.id === 'underdog') { const low = rk[rk.length - 1].rank; rk.filter(r => r.rank === low).forEach(r => awards[r.player.id] = 80); }
      else if (ev.id === 'luckydraw') { awards[pick(Store.players).id] = 50; }
      else if (ev.id === 'allstar') { Store.players.forEach(p => awards[p.id] = 30); }
      const show = () => {
        if (Object.keys(awards).length) {
          Score.commit(roundId, 'bonus', awards, {}, { noMultiplier: true, noWin: true, noRecent: true, title: 'ボーナス' });
          detail = `<div class="award-list mt8">${Object.keys(awards).map(id => { const p = Store.player(id); return `<div class="award">${avatarHTML(p, 'sm')}<div class="nm">${nameHTML(p)}</div><div class="pt">+${awards[id]}</div></div>`; }).join('')}</div>`;
        }
        $('#rres').innerHTML = `<div class="roulette-result panel neon"><div class="dim small">ボーナスイベント！</div><div class="rt">${esc(ev.title)}</div><p style="margin:6px 0 0">${esc(ev.desc)}</p>${ev.id === 'double' ? `<p class="small" style="color:var(--yellow);font-weight:900">${detail}</p>` : detail}</div>`;
        $('#ract').innerHTML = `<button class="btn" data-act="goBack">ゲームを選ぶ</button><button class="btn yellow sm" data-act="again">もう一度ルーレット</button>`;
        UI.handlers.again = () => this.roulette();
      };
      if (ev.id === 'luckydraw') {
        // 名前がくるくる回って当選者が決まる演出
        const winner = Store.player(Object.keys(awards)[0]); let k = 0; const t0 = performance.now();
        $('#rres').innerHTML = `<div class="roulette-result panel"><div class="dim small">横丁くじ引き</div><div class="rt" id="ld"></div></div>`;
        const id = Timers.interval(() => {
          const el = $('#ld'); if (!el) return;
          el.textContent = Store.players[k++ % Store.players.length].name; Sound.play('spin');
          if (performance.now() - t0 > 1600) { Timers.clear(id); el.textContent = winner.name; Sound.play('correct'); Timers.timeout(show, 700); }
        }, 90);
      } else show();
    };
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());

/* 背景の提灯 */
document.querySelectorAll('#bg .side-lantern').forEach((el,i)=>el.innerHTML=ICON.lantern(i?'#ff9a3c':'#ff4d5e',i?'丁':'横'));

</script>
</body>
